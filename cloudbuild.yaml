# Cloud Build pipeline for the Phoneware-hosted Bandwidth MCP.
#
# Triggered by pushes to `main` (Cloud Build GitHub trigger in phoneware-edge).
# Builds the image, pushes to Artifact Registry, deploys to Cloud Run.
#
# Prereqs (one-time, see DEPLOY.md):
#   - Artifact Registry repo `bandwidth-mcp` in us-central1.
#   - Secret Manager: bandwidth-client-id, bandwidth-client-secret,
#     bandwidth-gateway-token, bandwidth-mcp-google-client-id,
#     bandwidth-mcp-google-secret.
#   - The Cloud Run runtime SA can access those secrets (roles/secretmanager.secretAccessor).
#   - A Google OAuth web client whose authorized redirect URI is exactly
#     https://mcp.bandwidth.phoneware.cloud/auth/google/callback. Both halves of
#     it live in Secret Manager; nothing credential-shaped is set in GitHub.
#
# Security model: the service is public ingress (Bandwidth callbacks + the Claude
# client must reach it). /mcp is gated by a bearer this service issues, and it
# only issues one after a Google sign-in by an address on the allowlist. The
# Bandwidth API credential lives here and is never handed to a client (see
# serve.py). Holding it is equivalent to holding the carrier account.
steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        # Pins must match pyproject.toml and the Dockerfile. fastmcp 4.0.0b1 is
        # the MCP 2026-07-28 (stateless) release, still a beta, hence the exact pin.
        pip install --no-cache-dir "fastmcp==4.0.0b1" "mcp>=2.0.0,<3" \
          "httpx~=0.28.0" "httpx2~=2.9" \
          "pyyaml~=6.0.0" "werkzeug>=3.1.4" "google-cloud-firestore==2.21.0" \
          "tzdata" \
          uvicorn pytest pytest-asyncio pytest-httpx
        python -m pytest -q

  - id: build
    name: gcr.io/cloud-builders/docker
    waitFor: ['test']
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/bandwidth-mcp:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/bandwidth-mcp:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: ['build']
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/bandwidth-mcp']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: ['push']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - bandwidth-mcp
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/bandwidth-mcp:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      # Public ingress is required (Bandwidth callbacks + the Claude client reach
      # it directly); /mcp is protected by BW_GATEWAY_TOKEN inside the app.
      - --allow-unauthenticated
      # In-memory event store + webhook callbacks -> keep one warm instance.
      - --min-instances=1
      - --max-instances=1
      - --memory=512Mi
      - --cpu=1
      # Every credential this service holds, and the only place any of them
      # exist outside Secret Manager (which is nowhere).
      #   BW_GATEWAY_TOKEN       HMAC signing key for codes/bearers/client ids.
      #   BW_CLIENT_ID/SECRET    the Bandwidth API credential. It used to live in
      #                          each client's connector config, which meant it
      #                          had to be distributed to be used, so it leaked
      #                          into repos and plugin caches by construction. A
      #                          client_credentials exchange with it needs no
      #                          login and can port numbers away, so it is now
      #                          server-side only and never on the wire to a client.
      #   BW_OAUTH_CLIENT_ID/SECRET the Google web client behind the sign-in
      #                          gate. The id is not secret, but it rides here
      #                          anyway so one credential pair lives in one
      #                          place. Splitting it (id in a CI variable, secret
      #                          in GCP) means two systems to keep in step and
      #                          two ways to half-configure the gate.
      # Firestore refresh-family cursor writes use the Cloud Run runtime service
      # account. Verified prerequisite: 859122914438-compute@developer.gserviceaccount.com
      # already has roles/datastore.user in the project; no repo-local IAM patch
      # is required here.
      - --set-secrets=BW_GATEWAY_TOKEN=bandwidth-gateway-token:latest,BW_CLIENT_ID=bandwidth-client-id:latest,BW_CLIENT_SECRET=bandwidth-client-secret:latest,BW_OAUTH_CLIENT_ID=bandwidth-mcp-google-client-id:latest,BW_OAUTH_CLIENT_SECRET=bandwidth-mcp-google-secret:latest
      # BW_MCP_BASE_URL should be the service's public URL once known (needed for
      # voice/messaging callbacks). BW_MCP_PROFILE trims the tool surface.
      # --set-env-vars REPLACES the service env wholesale: this list is the
      # complete pipeline-managed env. BW_MCP_BASE_URL is the OAuth issuer and
      # callback base: it must ride here or a deploy wipes it.
      # Tool surface is deployment-managed here: profiles pick the groups,
      # BW_MCP_EXCLUDE_TOOLS prunes individual tools Phoneware doesn't use
      # (enforced uniformly for OpenAPI-derived AND hand-written tools).
      # ^@^ switches gcloud's env-var delimiter to @ so the comma lists pass
      # through intact.
      # Messaging is deliberately absent: Phoneware texts via Clerk/NS, not
      # Bandwidth directly (no createMessage/listMessages/media/inbound).
      # BW_ACCOUNT_ID pins the default account: the OAuth token lists the
      # accounts in an order where [0] is NOT the main Phoneware account
      # (5011296 first, 5011369 = the account the numbers live on). Tools
      # still reach the other account via their account_id parameter.
      # voice profile dropped: these creds return 403 on every Voice API
      # call (Phoneware's voice platform is NetSapiens, not Bandwidth), so
      # the voice tools were dead weight that could only mislead the agent.
      # lookup profile also dropped: the TN Lookup product is not enabled on
      # this Bandwidth account ("Account not authorized"); re-add the profile
      # here if Bandwidth enables it.
      # BW_OAUTH_ALLOWED_DOMAINS is who may sign in. serve.py refuses to boot on
      # an empty allowlist rather than defaulting to open: an empty list here
      # would hand the carrier account to any Google account on earth. Add named
      # outside contractors with BW_OAUTH_ALLOWED_EMAILS rather than widening it.
      # (The Google client id rides in --set-secrets above, with its secret.)
      - --set-env-vars=^@^BW_MCP_TRANSPORT=streamable-http@BW_MCP_HOST=0.0.0.0@BW_MCP_PORT=8080@BW_ACCOUNT_ID=5011369@BW_MCP_PROFILE=numbers,numbers-write,billing,call-history@BW_MCP_EXCLUDE_TOOLS=clearCredentials,createRegistration,uploadMedia,deleteMedia,createApplication@BW_MCP_BASE_URL=https://mcp.bandwidth.phoneware.cloud@BW_OAUTH_ALLOWED_DOMAINS=phoneware.us

substitutions:
  _REGION: us-central1
  _REPO: bandwidth-mcp

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/bandwidth-mcp:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/bandwidth-mcp:latest'

options:
  logging: CLOUD_LOGGING_ONLY
