              summary: Report definitions including CDRs
              value:
                links:
                  - rel: self
                    href: >-
                      https://insights.bandwidth.com/api/v2/report-definitions?offset=0&limit=50
                  - rel: first
                    href: >-
                      https://insights.bandwidth.com/api/v2/report-definitions?limit=50
                  - rel: last
                    href: >-
                      https://insights.bandwidth.com/api/v2/report-definitions?offset=0&limit=50
                data:
                  reportDefinitions:
                    - id: 6d4f848a-9543-4e18-b580-2621c9525892
                      category: USAGE
                      domain: VOICE
                      reportName: Call Detail Records (CDRs)
                      description: >-
                        Call Detail Records (CDRs) provides details for all the
                        Voice calls associated with your account. Data may be
                        delayed by a few hours.
                      regions:
                        - US
                        - EU
                      maxMonthsBack: 12
                      filters:
                        - filterName: accountIds
                          validationType: INTEGER
                          operator: IN
                          required: true
                        - filterName: callInviteTime
                          validationType: ISO8601
                          operator: GREATER_OR_EQUAL
                          required: true
                        - filterName: callInviteTime
                          validationType: ISO8601
                          operator: LESSER_OR_EQUAL
                          required: true
                        - filterName: callingCountryCodeA3
                          validationType: STRING
                          operator: IN
                          required: false
                        - filterName: calledCountryCodeA3
                          validationType: STRING
                          operator: IN
                          required: false
                        - filterName: callDirection
                          operator: EQUAL
                          required: false
                          allowedValues:
                            - inbound
                            - outbound
