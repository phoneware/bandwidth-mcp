                $ref: '#/components/schemas/monitorSliceErrorPercentage'
    monitorResponseDataAverageDuration:
      title: Monitor Response Data - Average Duration
      allOf:
        - $ref: '#/components/schemas/monitorDataBase'
        - type: object
          properties:
            slices:
              type: array
              items:
                $ref: '#/components/schemas/monitorSliceAverageDuration'
    monitorResponseDataTotalShortCalls:
      title: Monitor Response Data - Total Short Calls
      allOf:
        - $ref: '#/components/schemas/monitorDataBase'
        - type: object
          properties:
            slices:
              type: array
              items:
                $ref: '#/components/schemas/monitorSliceTotalShortCalls'
    monitorResponseDataNetworkEfficiencyRatio:
      title: Monitor Response Data - Network Efficiency Ratio
      allOf:
        - $ref: '#/components/schemas/monitorDataBase'
        - type: object
          properties:
            slices:
              type: array
              items:
                $ref: '#/components/schemas/monitorSliceNetworkEfficiencyRatio'
    monitorResponseDataCallsPerSecond:
      title: Monitor Response Data - Calls Per Second
      allOf:
        - $ref: '#/components/schemas/monitorDataBase'
        - type: object
          properties:
            slices:
              type: array
              items:
                $ref: '#/components/schemas/monitorSliceCallsPerSecond'
    monitorResponseDataConcurrentCalls:
      title: Monitor Response Data - Concurrent Calls
      allOf:
        - $ref: '#/components/schemas/monitorDataBase'
        - type: object
          properties:
            slices:
              type: array
              items:
                $ref: '#/components/schemas/monitorSliceConcurrentCalls'
  parameters:
    monitorDirection:
      name: direction
      in: query
      description: >-
        Filter call data to only inbound or outbound calls.

        If not provided, both inbound and outbound calls are returned in the
        results.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/monitorDirection'
    monitorTimestamp:
      name: timestamp
      in: query
      description: >-
        Timestamp range filter for the time range to return records for.

        Use `gte` for the beginning of the range (defaults to '7 days ago' if
        not specified).

        Use `lte` for the end of the range (defaults to 'now' if not specified).

        Values should include timezone, else UTC will be assumed.

        Note, results will only be returned going back up to one year.

        A larger timespan, difference between `gte` and `lte` will make the
        results less granular, for example a timespan of a few days, results
        will be hourly, whilst a timespan of months, result will be monthly.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/monitorTimestampRange'
    monitorFromPhoneNumber:
      name: fromPhoneNumber
      in: query
      description: >-
        Filter results by originating phone number(s) in E.164 format (e.g.
        `+353123456`).

        Accepts a comma-separated list of numbers.

        **Warning:** Using this parameter may result in dramatically slower
        responses.

        To improve performance, use additional query parameters to reduce the
        scope of your query.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/monitorPhoneNumberList'
    monitorToPhoneNumber:
      name: toPhoneNumber
      in: query
      description: >-
        Filter results by destination phone number(s) in E.164 format (e.g.
        `+353123456`).

        Accepts a comma-separated list of numbers.

        **Warning:** Using this parameter may result in dramatically slower
        responses.

        To improve performance, use additional query parameters to reduce the
        scope of your query.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/monitorPhoneNumberList'
    monitorSubAccount:
      name: subAccount
      in: query
      description: >-
        Filter results by Sub-Account ID.

        The user making this API call must have access to the specified
        sub-account.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/monitorSubAccount'
    monitorCallResult:
      name: callResult
      in: query
      description: |-
        Filter results by call completion status.
        Accepts a single value: `COMPLETED` or `INCOMPLETE`.
        If not provided, results for all call results will be returned.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/monitorCallResult'
    monitorResponseCode:
      name: responseCode
      in: query
      description: |-
        List of SIP response codes to filter for.
        These are three digit codes, i.e. regex pattern `\d{3}`.
        If not set, then all response codes are included.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/monitorResponseCode'
    monitorCallType:
      name: callType
      in: query
      description: >-
        Filter results by call type. Accepts a single value from the enum
        defined in the schema (e.g. `INTERNATIONAL`, `EMERGENCY`, `LOCAL`).

        If not provided, results for all call types will be returned.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/monitorCallType'
    monitorHangUpSource:
      name: hangUpSource
      in: query
      description: |-
        Filter results by hang up source.
        Accepts a single value: `CALLED_PARTY` or `CALLING_PARTY`.
        If not provided, results for all hang up sources will be returned.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/monitorHangUpSource'
    monitorSourceCountryCodeA3:
      name: sourceCountryCodeA3
      in: query
      description: >-
        Filter results by source country.

        Accepts a comma-separated list of ISO A3 country codes (e.g. `USA`,
        `CAN`).

        If not provided, results for all source countries will be returned.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/monitorCountry'
    monitorDestinationCountryCodeA3:
      name: destinationCountryCodeA3
      in: query
      description: >-
        Filter results by destination country.

        Accepts a comma-separated list of ISO A3 country codes (e.g. `USA`,
        `CAN`).

        If not provided, results for all destination countries will be returned.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/monitorCountry'
    monitorAccountId:
      name: accountId
      in: query
      required: true
      description: CRM ID of the account to get calls data from.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/monitorAccountId'
    accountIds:
      name: accountIds
      in: query
      description: One or more account IDs to filter report history by.
      schema:
        type: array
        items:
          type: string
    categoryRequired:
      name: category
      in: query
      required: true
      description: The report category to filter by.
      schema:
        $ref: '#/components/schemas/category'
    category:
      name: category
      in: query
      description: Filter report definitions by category classification.
      schema:
        $ref: '#/components/schemas/category'
    domain:
      name: domain
      in: query
      description: Filter report definitions by product domain.
      schema:
        $ref: '#/components/schemas/domain'
    reportIdPath:
      name: reportId
      in: path
      description: The ID of the report.
      required: true
      schema:
        type: string
    reportDefIdPath:
      name: reportDefinitionId
      in: path
      description: The UUID of the report definition.
      required: true
      schema:
        type: string
        format: uuid
        example: 6d4f848a-9543-4e18-b580-2621c9525892
    reportName:
      name: reportName
      in: query
      description: Filter report definitions by exact report name.
      schema:
        type: string
    accountId:
      name: accountId
      in: query
      description: CRM ID of the account to get calls from.
      schema:
        type: string
        example: '1234567'
    callId:
      name: callId
      in: query
      description: |
        Exact Match, any valid call ID.
      schema:
        type: string
        example: 12345678980abcdefghijklmnopqrstuvwxyz
    sipCallId:
      name: sipCallId
      in: query
      description: |
        Filter Type: Exact Match, any valid SIP call ID.
      schema:
        type: string
        example: aabbccddeeff00112233445566778899@10.0.0.1
    programmableCallId:
      name: programmableCallId
      in: query
      description: |
        Filter Type: Exact Match, any valid Programmable Voice call ID.
      schema:
        type: string
        example: c-1234567890abcdef
    callIdPath:
      name: callId
      in: path
      required: true
      description: >-
        Filter Type: Exact Match, any valid call ID.


        By default this is treated as a plain string. If the call ID contains
        characters that are not

        permitted in a URL path (notably `/`), pass it as a base64url (RFC 4648
        §5) encoded string and

        set the `callIdEncoding` query parameter to `BASE64_URL` so it is
        decoded before lookup.
      schema:
        type: string
        example: 12345678980abcdefghijklmnopqrstuvwxyz
    callIdEncoding:
      name: callIdEncoding
      in: query
      required: false
      description: >-
        Opt-in encoding applied to the `callId` path parameter. When set to
        `BASE64_URL`, the

        `callId` is decoded as a base64url (RFC 4648 §5) string before lookup.
        This allows call IDs

        containing characters that are not permitted in a URL path (notably `/`)
        to be passed safely.


        When omitted or set to `RAW`, the `callId` is used verbatim. Standard
        Base64 is not supported because its

        `+` and `/` characters would reintroduce the path-encoding problem.
      schema:
        $ref: '#/components/schemas/callIdEncoding'
    startTime:
      name: startTime
      in: query
      description: >
        Filter Type: Range using gt, gte, lt, and lte. Timestamps must conform
        to RFC 3339 format. All timestamps are interpreted as UTC.


        Note: If no startTime or endTime is specified, startTime will default to
        the last 24 hours.
      schema:
        type: string
        example: |
          gte:2022-05-26T12:00:00Z
    endTime:
      name: endTime
      in: query
      description: >
        Filter Type: Range using gt, gte, lt, and lte. Timestamps must conform
        to RFC 3339 format. All timestamps are interpreted as UTC.
      schema:
        type: string
        example: lte:2022-05-26T12:00:50Z
    callingNumber:
      name: callingNumber
      in: query
      description: >-
        Short number exact match, Short number Multimatch, Short number prefix
        match, E.164 exact match, E.164 Multimatch, E.164 prefix match,
        Alphanumeric exact match, Alphanumeric Multimatch, Alphanumeric prefix
        match.


        Example:


        * Short number exact match: 15555551234


        * Short number Multimatch: 1555*,1234*,15555551234,15555554567


        * Short number prefix match: 1555*


        * E.164 exact match: +15555551234


        * E.164 Multimatch: +1555*,+1234*,+15555551234,+15555554567


        * E.164 prefix match: +1555*


        * Alphanumeric exact match: WO1234567


        * Alphanumeric Multimatch: WO1234567, PO4567891, WO*, PO*


        * Alphanumeric prefix match: WO*


        Alphanumeric string of length 1 to 15 characters with optional leading
        '+' (URL encoded as %2B) and optional trailing '*' (indicating prefix
        search)
      schema:
        type: string
        example: '%2B18185559876'
    calledNumber:
      name: calledNumber
      in: query
      description: >-
        Short number exact match, Short number Multimatch, Short number prefix
        match, E.164 exact match, E.164 Multimatch, E.164 prefix match,
        Alphanumeric exact match, Alphanumeric Multimatch, Alphanumeric prefix
        match.


        Example:


        * Short number exact match: 15555551234


        * Short number Multimatch: 1555*,1234*,15555551234,15555554567


        * Short number prefix match: 1555*


        * E.164 exact match: +15555551234


        * E.164 Multimatch: +1555*,+1234*,+15555551234,+15555554567


        * E.164 prefix match: +1555*


        * Alphanumeric exact match: WO1234567


        * Alphanumeric Multimatch: WO1234567, PO4567891, WO*, PO*


        * Alphanumeric prefix match: WO*


        Alphanumeric string of length 1 to 15 characters with optional leading
        '+' (URL encoded as %2B) and optional trailing '*' (indicating prefix
        search)
      schema:
        type: string
        example: '%2B18185551234'
    callDirection:
      name: callDirection
      in: query
      description: |-
        Direction of call.
        Filter Type: Exact Match, Multi Match.

        Example:
          * Exact Match: OUTBOUND

          * Multi Match: OUTBOUND-FORWARDED,OUTBOUND
      schema:
        type: array
        items:
          $ref: '#/components/schemas/callDirection'
    callType:
      name: callType
      in: query
      description: 'Filter Type: Exact Match, any valid call type.'
      schema:
        $ref: '#/components/schemas/callType'
    callResult:
      name: callResult
      in: query
      description: 'Filter Type: Exact Match, any valid call result type.'
      schema:
        $ref: '#/components/schemas/callResult'
    hangUpSource:
      name: hangUpSource
      in: query
      description: 'Filter Type: Exact Match, any valid hang up source.'
      schema:
        $ref: '#/components/schemas/hangUpSource'
    sipResponseCode:
      name: sipResponseCode
      in: query
      description: |-
        Filter Type: Exact Match, Multi Match.

        Example:
          * Exact Match: 200

          * Multi Match: 200, 202
      schema:
        type: array
        items:
          type: string
        example: 200
    subAccount:
      name: subAccount
      in: query
      description: 'Filter Type: Exact Match. Examples: 1234,2345'
      schema:
        type: string
        example: '1234'
    locationId:
      name: locationId
      in: query
      description: 'Filter Type: Exact Match. Examples: 1234,2345'
      schema:
        type: string
        example: '1234'
    sourceCountryCodeA3:
      name: sourceCountryCodeA3
      in: query
      description: >-
        Filter by the source country of the call using ISO 3166-1 alpha-3
        country codes (e.g. `USA`, `IRL`).

        Accepts an exact match or a comma-separated list for multi-match (e.g.
        `USA,CAN`).
      schema:
        $ref: '#/components/schemas/countryCodeA3'
    destinationCountryCodeA3:
      name: destinationCountryCodeA3
      in: query
      description: >-
        Filter by the destination country of the call using ISO 3166-1 alpha-3
        country codes (e.g. `USA`, `IRL`).

        Accepts an exact match or a comma-separated list for multi-match (e.g.
        `USA,CAN`).
      schema:
        $ref: '#/components/schemas/countryCodeA3'
    sourceIp:
      name: sourceIp
      in: query
      description: >-
        Filter by the source IP address of the call. Accepts IPv4 or IPv6
        format. IPv6 colons must be URL-encoded as `%3A`.

        Filter Type: Exact Match.
      schema:
        $ref: '#/components/schemas/ipAddress'
    destinationIp:
      name: destinationIp
      in: query
      description: >-
        Filter by the destination IP address of the call. Accepts IPv4 or IPv6
        format. IPv6 colons must be URL-encoded as `%3A`.

        Filter Type: Exact Match.
      schema:
        $ref: '#/components/schemas/ipAddress'
    qualityStatus:
      name: qualityStatus
      in: query
      description: >-
        Filter by the overall call quality status, derived from a combination of
        Jitter, Latency, and Packet Loss Percentage.

        Only available for accounts with the Advanced Quality Metrics feature.
      schema:
        $ref: '#/components/schemas/qualityStatus'
    attestationIndicator:
      name: attestationIndicator
      in: query
      description: |-
        Filter by STIR/SHAKEN attestation level.
        Filter Type: Exact Match or Multi Match (comma-separated).
      schema:
        $ref: '#/components/schemas/attestationIndicator'
    x5u:
      name: x5u
      in: query
      description: |-
        Filter by the X5U URL of the STIR/SHAKEN certificate's location.
        Filter Type: Exact Match or Text Match (substring).
      schema:
        $ref: '#/components/schemas/x5u'
    sort:
      name: sort
      in: query
      description: >-
        The field and direction to sort by, combined with a colon. Direction is
        one of asc, desc.
      schema:
        type: string
        example: startTime:desc
    offset:
      name: offset
      in: query
      description: Return records starting at the nth record.
      schema:
        type: integer
        example: 1
    limit:
      name: limit
      in: query
      description: The maximum records to return per page.
      schema:
        type: integer
        example: 50
        default: 100
        minimum: 1
        maximum: 10000
    region:
      name: region
      in: query
      description: >-
        Filter Type: Exact Match, any valid region. Use ALL to search both US
        and EU regions in a single call. Defaults to US.
      schema:
        $ref: '#/components/schemas/region'
  requestBodies:
    createReportBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/reportStatusObject'
    paginatedReportRequestBody:
      required: true
      content:
        application/json:
          schema:
