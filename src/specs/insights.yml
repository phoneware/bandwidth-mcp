                  report:
                    category: USAGE
                    domain: MESSAGING
                    reportName: Messaging Detail Records (MDRs)
              errors:
                type: array
                nullable: true
                items:
                  $ref: '#/components/schemas/apiError'
                example: []
            required:
              - links
              - data
              - errors
    reportStatusResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              links:
                type: array
                items:
                  $ref: '#/components/schemas/link'
                example:
                  - rel: reportDownload
                    href: >-
                      https://insights.bandwidth.com/api/v1/reports/67a95525-4618-418b-ad8b-4ddd8562ad37/file
              data:
                $ref: '#/components/schemas/reportStatus'
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/apiError'
                example: []
            required:
              - links
              - data
              - errors
    reportFileResponse:
      description: OK
