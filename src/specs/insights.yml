        '500':
          $ref: '#/components/responses/monitorInternalServerError'
        '503':
          $ref: '#/components/responses/monitorServiceUnavailableError'
  /v1/monitors/voice/concurrent-calls:
    get:
      summary: List Concurrent Calls
      description: >-
        Retrieves an aggregated summary of concurrent calls based on the
        provided filters. This api is only available for accounts with
        Monitoring API feature.


        The summary returned is broken down into time 'slices' depending on the
        time range requested.

        The granularity is calculated based on:
         * 0-24 hours: hour
         * 25 hours - 7 days: day
         * 8 days - 30 days: week
         * 31+ days: month

        Through the use of various query parameters, users can filter the data
        by phone numbers, sub-account, call type, hang-up source, and country.


        Occasionally, underlying data may take longer than expected to load. To
        avoid connection timeouts, the API will return a `503 Service
        Unavailable` response in these cases, with an error message indicating
        that the data is still loading. If you receive a `503`, retry your
        request immediately with the exact same parameters.
      operationId: getConcurrentCallsData
      tags:
        - Voice
      parameters:
        - $ref: '#/components/parameters/monitorAccountId'
        - $ref: '#/components/parameters/monitorTimestamp'
        - $ref: '#/components/parameters/monitorFromPhoneNumber'
        - $ref: '#/components/parameters/monitorToPhoneNumber'
        - $ref: '#/components/parameters/monitorSubAccount'
        - $ref: '#/components/parameters/monitorCallType'
        - $ref: '#/components/parameters/monitorHangUpSource'
        - $ref: '#/components/parameters/monitorSourceCountryCodeA3'
        - $ref: '#/components/parameters/monitorDestinationCountryCodeA3'
      responses:
        '200':
          $ref: '#/components/responses/getMonitorConcurrentCallsResponseOk'
        '400':
          $ref: '#/components/responses/monitorBadRequestError'
        '401':
          $ref: '#/components/responses/monitorUnauthorizedError'
        '403':
          $ref: '#/components/responses/monitorForbiddenError'
        '404':
          $ref: '#/components/responses/monitorNotFoundError'
        '405':
          $ref: '#/components/responses/monitorMethodNotFoundError'
        '429':
          $ref: '#/components/responses/monitorTooManyRequestsError'
        '500':
          $ref: '#/components/responses/monitorInternalServerError'
        '503':
          $ref: '#/components/responses/monitorServiceUnavailableError'
