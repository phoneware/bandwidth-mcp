  /v2/report-definitions:
    get:
      tags:
        - Reporting v2
      summary: Get Report Definitions
      description: >-
        Lists the report definitions available to your account. A report
        definition is a template for a report you can run — it describes the
        report's category and domain, the filter parameters it accepts (with the
        operators and value types valid for each), the fields returned in each
        result row, and the execution flows it supports (`supportedModes`).


        Use this endpoint to discover which reports you can run and to obtain
        each report's `reportDefinitionId`. Narrow the list with the `category`,
        `domain`, and `reportName` query parameters; results are paginated via
        `offset` and `limit`.


        This is the starting point of the synchronous reporting workflow: list
        definitions here, fetch a single definition to inspect its filters in
        detail, then request its results.


        This API currently supports the synchronous (`SYNC`) flow, so only
        report definitions that can be run synchronously are returned;
        definitions that use the asynchronous (`ASYNC`) flow are not available
        through this API.


        This API is only available to accounts with access to the synchronous
        reports functionality.
      operationId: listReportDefinitions
      x-rate-limit:
        maxRequestsPerDay: 100
      parameters:
        - $ref: '#/components/parameters/category'
        - $ref: '#/components/parameters/domain'
        - $ref: '#/components/parameters/reportName'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          $ref: '#/components/responses/paginatedReportDefinitionsResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '405':
          $ref: '#/components/responses/methodNotFoundError'
        '429':
          $ref: '#/components/responses/tooManyRequestsError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /v2/report-definitions/{reportDefinitionId}:
    get:
      tags:
        - Reporting v2
      summary: Get Report Definition
      description: >-
        Returns the full definition of a single report, identified by its
        `reportDefinitionId`. The response contains everything needed to run the
        report: its category and domain, the regions it covers, the maximum
        historical range available (`maxMonthsBack`), the complete list of
        filter parameters — with their supported operators, value types, and
        whether each is required — the output fields returned in each result
        row, and the execution flows it supports (`supportedModes`).


        Call this after discovering a report via `GET /v2/report-definitions` to
        learn exactly how to construct a results request for it.


        This API currently supports the synchronous (`SYNC`) flow, so a report
        definition that cannot be run synchronously is not retrievable through
        this endpoint.


        This API is only available to accounts with access to the synchronous
        reports functionality.
      operationId: getReportDefinition
      x-rate-limit:
        maxRequestsPerDay: 100
      parameters:
        - $ref: '#/components/parameters/reportDefIdPath'
      responses:
        '200':
          $ref: '#/components/responses/paginatedReportDefinitionResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '405':
          $ref: '#/components/responses/methodNotFoundError'
        '429':
          $ref: '#/components/responses/tooManyRequestsError'
        '500':
          $ref: '#/components/responses/internalServerError'
  /v2/report-definitions/{reportDefinitionId}/results:
    post:
      tags:
        - Reporting v2
      summary: Generate Report Results
      description: >-
        Runs the report identified by `reportDefinitionId` and returns its rows
        synchronously in the response — there is no job to poll and no file to
        download. The query criteria supplied in the request body are validated
        against the report's definition: at least one criterion is required, and
        some reports require specific parameters (for example a time range, or a
        `region` when the report spans more than one region).


        Results are returned a page at a time — use `pageSize` and `pageNumber`
        to control paging, and follow the pagination links in the response to
        fetch subsequent pages.


        Before calling this endpoint, use `GET
        /v2/report-definitions/{reportDefinitionId}` to discover the available
        filter parameters, operators, value types, and required fields, then
        pass matching criteria here.


        Only report definitions that support the synchronous (`SYNC`) flow can
        be run through this endpoint. This API is only available to accounts
        with access to the synchronous reports functionality.
      operationId: createReportResults
      x-rate-limit:
        maxRequestsPerDay: 100
      parameters:
        - $ref: '#/components/parameters/reportDefIdPath'
      requestBody:
        $ref: '#/components/requestBodies/paginatedReportRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/paginatedResultResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '405':
          $ref: '#/components/responses/methodNotFoundError'
        '429':
          $ref: '#/components/responses/tooManyRequestsError'
        '500':
          $ref: '#/components/responses/internalServerError'
components:
  schemas:
    callIdEncoding:
      type: string
      enum:
        - RAW
        - BASE64_URL
      example: BASE64_URL
      default: RAW
    monitorDirection:
      type: object
      properties:
        eq:
          type: string
          enum:
            - INBOUND
            - OUTBOUND
          description: Filter call data to only inbound or outbound calls.
      example:
        eq: INBOUND
    monitorTimestampRange:
      type: object
      properties:
        gte:
          type: string
          format: date-time
          description: >-
            Greater than or equal to the specified date and time (start of
            range).
        lte:
          type: string
          format: date-time
          description: Less than or equal to the specified date and time (end of range).
      example:
        gte: '2026-02-17T14:30:00+02:00'
        lte: '2026-02-24T14:30:00+02:00'
    monitorPhoneNumberList:
      type: object
      properties:
        eq:
          type: string
          description: Comma-separated list of phone numbers in E.164 format
          example: +353123456,+353987654
    monitorSubAccount:
      type: object
      properties:
        eq:
          type: string
          description: Sub-Account ID
      example:
        eq: '1234'
    monitorCallResult:
      type: object
      properties:
        eq:
          type: string
          enum:
            - COMPLETED
            - INCOMPLETE
          description: Filter results by call completion status.
      example:
        eq: COMPLETED
    monitorResponseCode:
      type: object
      properties:
        eq:
          type: string
          description: Comma-separated list of SIP response codes
          example: 200,202
    monitorCallType:
      type: object
      properties:
        eq:
          type: string
          enum:
            - EMERGENCY
            - INBOUND_TFOOS
            - INFORMATION
            - INTERNATIONAL
            - INTERNATIONAL_INTERNAL
            - INTERSTATE
            - INTRASTATE
            - INTL_BLOCK
            - LOCAL
            - OPERATOR
            - OTHER_N11
            - SIPURI_EXT
            - TOLLFREE_IN
            - TOLLFREE_OUT
            - UNDETERMINED
          description: Filter results by call type.
      example:
        eq: INTERNATIONAL
    monitorHangUpSourceResponse:
      type: string
      enum:
        - CALLED_PARTY
        - CALLING_PARTY
        - BANDWIDTH_INTERNAL
      example: CALLED_PARTY
    monitorHangUpSource:
      type: object
      properties:
        eq:
          type: string
          enum:
            - CALLED_PARTY
            - CALLING_PARTY
            - BANDWIDTH_INTERNAL
          description: Filter results by hang up source.
      example:
        eq: CALLED_PARTY
    monitorCountry:
      type: object
      properties:
        eq:
          type: string
          description: Comma-separated list of ISO A3 country codes
          example: USA,CAN
    monitorAccountId:
      type: object
      properties:
        eq:
          type: string
          description: CRM ID of the account to get calls data from.
      example:
        eq: '1234567'
    reportStatusObject:
      title: Create Report Request
      type: object
      properties:
        category:
          $ref: '#/components/schemas/category'
        domain:
          $ref: '#/components/schemas/domain'
        reportName:
          type: string
          example: MDRs
        accountIds:
          type: array
          items:
            type: string
            example: '123456'
          example:
            - '123456'
            - '654321'
        filters:
          $ref: '#/components/schemas/filters'
        region:
          $ref: '#/components/schemas/reportRegion'
        breakdown:
          type: string
          example: campaignId
          description: The filter name to breakdown the report by.
        useNotifications:
          type: boolean
          description: >-
            When `true`, a notification is sent when the report is ready for
            download. Requires notifications to be enabled on the account.
          example: true
          default: false
    reportStatus:
      type: object
      properties:
        reportId:
          type: string
          example: 67a95525-4618-418b-ad8b-4ddd8562ad37
          format: uuid
        requestedAt:
          type: string
          format: date-time
          example: 2024-01-18T17:38:37.041Z
        completedAt:
          type: string
          format: date-time
          example: 2024-01-18T17:38:37.041Z
        user:
          type: string
          example: Username
        report:
          $ref: '#/components/schemas/reportStatusObject'
        status:
          $ref: '#/components/schemas/status'
        fileName:
          type: string
          example: report123.zip
    reportDefinitionObject:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/category'
        domain:
          $ref: '#/components/schemas/domain'
        reportName:
          type: string
          example: MDRs
        description:
          type: string
          example: Messaging details for particular snapshot date
        regions:
          type: array
          items:
            $ref: '#/components/schemas/region'
          example:
            - US
            - EU
        maxMonthsBack:
          type: integer
          example: 12
          minimum: 1
          maximum: 24
        filters:
          type: array
          items:
            $ref: '#/components/schemas/rdoFilter'
        breakdowns:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                example: column_name
    paginatedReportDefinitionObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Unique identifier for the report definition. Use this ID to fetch
            the full definition via `GET
            /v2/report-definitions/{reportDefinitionId}` or to retrieve results
            via `POST /v2/report-definitions/{reportDefinitionId}/results`.
          example: 6d4f848a-9543-4e18-b580-2621c9525892
        category:
          $ref: '#/components/schemas/category'
        domain:
          $ref: '#/components/schemas/domain'
        reportName:
          type: string
          description: Human-readable name of the report.
          example: CDRs
        description:
          type: string
          description: Detailed description of the report and its data.
          example: >-
            Call Detail Records provides details for all the Voice calls
            associated with your account.
        regions:
          type: array
          description: Regions where this report is available.
          items:
            $ref: '#/components/schemas/region'
          example:
            - US
            - EU
        maxMonthsBack:
          type: integer
          description: >-
            Maximum number of months of historical data available for this
            report.
          example: 12
          minimum: 1
          maximum: 24
        filters:
          type: array
          description: >-
            List of filter definitions that can be applied when retrieving
            results for this report.
          items:
            $ref: '#/components/schemas/paginatedRdoFilter'
        outputFields:
          type: array
          description: >-
            The fields returned in each result row from `POST
            /v2/report-definitions/{reportDefinitionId}/results`.
          items:
            $ref: '#/components/schemas/paginatedOutputField'
        supportedModes:
          type: array
          description: >-
            The execution flows this report definition supports.

            `SYNC` returns results inline from `POST
            /v2/report-definitions/{reportDefinitionId}/results`.

            `ASYNC` is generated via the report instance flow and retrieved as a
            file.
          items:
            $ref: '#/components/schemas/supportedMode'
          minItems: 1
          example:
            - SYNC
      required:
        - id
        - category
        - domain
        - reportName
        - description
        - regions
        - maxMonthsBack
        - filters
        - outputFields
        - supportedModes
    paginatedResultRow:
      type: object
      description: >
        A single row of report results. The field names and types are dynamic
        and depend on the report definition. Use GET
        /v2/report-definitions/{reportDefinitionId} to discover available fields
        for a given report.
      additionalProperties: true
    paginatedOutputField:
      type: object
      description: Describes a single output field returned in each result row.
      properties:
        fieldName:
          type: string
          description: The field name as it appears in the result row.
          example: customerId
        fieldType:
          $ref: '#/components/schemas/paginatedFieldType'
      required:
        - fieldName
        - fieldType
    paginatedPageMeta:
      type: object
      description: Pagination metadata for the current response page.
      properties:
        pageSize:
          type: integer
          description: Number of results per page.
          example: 50
        totalElements:
          type: integer
          description: Total number of items in the collection.
          example: 1
        totalPages:
          type: integer
          description: Total number of pages.
          example: 1
        pageNumber:
          type: integer
          description: Current page number (zero-indexed).
          example: 0
      required:
        - pageSize
        - totalElements
        - totalPages
        - pageNumber
    category:
      type: string
      description: The category classification of the report definition.
      enum:
        - CHARGES
        - NUMBER_DETAILS
        - USAGE
      example: USAGE
    dropdownValues:
      type: object
      properties:
        values:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                example: column_name
    domain:
      type: string
      description: The product domain the report definition belongs to.
      enum:
        - EMERGENCY
        - MESSAGING
        - VOICE
      example: MESSAGING
    operator:
      type: string
      enum:
        - EQUAL
        - GREATER
        - LESSER
        - LESSER_OR_EQUAL
        - GREATER_OR_EQUAL
        - LIKE
        - IN
        - STARTS_WITH
        - BETWEEN
      example: EQUAL
    paginatedFieldType:
      type: string
      description: The data type of a report output field.
      enum:
        - STRING
        - INTEGER
        - NUMBER
        - BOOLEAN
      example: STRING
    supportedMode:
      type: string
      description: An execution flow that a report definition can be run in.
      enum:
        - SYNC
        - ASYNC
      example: SYNC
    paginatedOperator:
      type: string
      enum:
        - EQUAL
        - GREATER
        - LESSER
        - LESSER_OR_EQUAL
        - GREATER_OR_EQUAL
        - LIKE
        - IN
        - CONTAINS
        - STARTS_WITH
        - BETWEEN
      description: |-
        Comparison operator applied to `values` against `parameter`.
          - `EQUAL` (`=`) — exact match; single value.
          - `GREATER` (`>`) — strictly greater than; single value.
          - `LESSER` (`<`) — strictly less than; single value.
          - `LESSER_OR_EQUAL` (`<=`) — less than or equal to; single value.
          - `GREATER_OR_EQUAL` (`>=`) — greater than or equal to; single value.
          - `LIKE` — SQL-style pattern match; single value.
          - `IN` — value matches any in the list; one or more values.
          - `CONTAINS` — substring match; single value.
          - `STARTS_WITH` — prefix match; single value.
          - `BETWEEN` — inclusive range; exactly two values `[lower, upper]`.
      example: STARTS_WITH
    paginatedReportFilter:
      type: object
      required:
        - parameter
        - operator
        - values
      properties:
        parameter:
          type: string
          description: >-
            Name of the parameter to filter on. Must match a `filterName`
            returned by

            `GET /v2/report-definitions/{reportDefinitionId}`.
          example: fromNumber
        operator:
          $ref: '#/components/schemas/paginatedOperator'
        values:
          type: array
          minItems: 1
          description: >-
            Operand value(s) for the operator, always serialized as strings (the
            server

            parses each value according to the parameter's declared type from
            the report

            definition). Most operators take a single value; `IN` accepts one or
            more;

            `BETWEEN` expects exactly two values `[lower, upper]`.
          items:
            type: string
          example:
            - '+1919'
    paginatedReportRequest:
      type: object
      required:
        - queryCriteria
      description: >-
        Request body for generating report results. Query criteria target

        parameters defined by the report definition; pagination is controlled
        via

        `pageSize` and `pageNumber`.
      properties:
        queryCriteria:
          type: array
          minItems: 1
          description: >-
            List of criteria to apply to the report. At least one criterion is
            required;

            individual reports may require specific parameters — call

            `GET /v2/report-definitions/{reportDefinitionId}` to see which

            parameters are marked `required: true` for that report.

            When a report supports more than one region (see `regions` on the
            report

            definition), a `region` criterion must also be supplied.
          items:
            $ref: '#/components/schemas/paginatedReportFilter'
        pageSize:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1000
          default: 50
          description: Number of rows to return per page.
          example: 50
        pageNumber:
          type: integer
          nullable: true
          minimum: 0
          default: 0
          description: Zero-based index of the page to return.
          example: 10
      example:
        queryCriteria:
          - parameter: region
            operator: EQUAL
            values:
              - US
          - parameter: accountIds
            operator: IN
            values:
              - '9900000'
              - '9900001'
          - parameter: callInviteTime
            operator: BETWEEN
            values:
              - '2026-01-01T00:00:00.000Z'
              - '2026-01-31T23:59:59.999Z'
          - parameter: fromNumber
            operator: STARTS_WITH
            values:
              - '+1919'
          - parameter: callDirection
            operator: IN
            values:
              - inbound
              - outbound
        pageSize: 50
        pageNumber: 0
    status:
      type: string
      enum:
        - COMPLETED
        - FAILED
        - NO_RESULTS
        - PROCESSING
      example: COMPLETED
    validationType:
      type: string
      description: >-
        The validation rule applied to a filter value; a value that does not
        satisfy its rule is rejected with a 400.


        - `E164`: a phone number in E.164 format, e.g. `"+12345678901"`.

        - `REGEX`: a string matching the filter's own `validationRegex`, e.g.
        `"matchingValue"`.

        - `ISO8601`: a full date-time with millisecond precision, e.g.
        `"2023-12-30T23:59:59.000Z"`.

        - `ISO8601_RANGE`: a start and end date-time (millisecond precision),
        used with `BETWEEN`, e.g. `["2023-12-01T00:00:00.000Z",
        "2023-12-31T23:59:59.000Z"]`.

        - `ISO8601_YEAR_MONTH`: a year and month, e.g. `"2023-12"`.

        - `ISO8601_DATE`: a calendar date, e.g. `"2023-12-31"`.

        - `STRING`: any string, e.g. `"someString"`.

        - `INTEGER`: an integer, e.g. `123`.

        - `ACCOUNT`: a customer account ID, e.g. `"9900000"`.


        The `ISO8601*` types are also bounded by the report's `maxMonthsBack`.
      enum:
        - E164
        - REGEX
        - ISO8601
        - ISO8601_RANGE
        - ISO8601_YEAR_MONTH
        - ISO8601_DATE
        - STRING
        - INTEGER
        - ACCOUNT
      example: STRING
    filters:
      description: >-
        Use the Get Report Definitions endpoint to see the filters available for
        a report.
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    rdoFilter:
      type: object
      properties:
        filterName:
          type: string
          example: My Filter
        validationType:
          $ref: '#/components/schemas/validationType'
        dropdownValues:
          type: array
          items:
            $ref: '#/components/schemas/dropdownValues'
        operator:
          $ref: '#/components/schemas/operator'
        validationRegex:
          type: string
          example: ^\\d{10}$
        required:
          type: boolean
          example: true
    paginatedRdoFilter:
      oneOf:
        - title: EnumeratedFilter
          description: >-
            A filter whose valid values are listed in allowedValues. The caller
            can provide one of the listed values.
          type: object
          properties:
            filterName:
              type: string
              description: >-
                The name of the filter field as used in the `queryCriteria`
                request body.
              example: callDirection
            allowedValues:
              type: array
              description: >-
                Allowed values for this filter. The caller can supply one of the
                listed values.
              items:
                type: string
              example:
                - inbound
                - outbound
            operator:
              $ref: '#/components/schemas/paginatedOperator'
            required:
              type: boolean
              nullable: true
              description: Indicates whether this filter must be supplied by the caller.
              example: false
          required:
            - filterName
            - allowedValues
            - operator
        - title: ValidationTypeFilter
          description: >-
            A filter validated by type, with an optional regex constraint. Use
            when valid values are not a fixed enumerable set.
          type: object
          properties:
            filterName:
              type: string
              description: >-
                The name of the filter field as used in the `queryCriteria`
                request body.
              example: callInviteTime
            validationType:
              $ref: '#/components/schemas/validationType'
            validationRegex:
              type: string
              nullable: true
              description: >-
                Regular expression pattern the filter value must match. Only
                applicable when validationType is REGEX.
              example: ^\\d{10}$
            operator:
              $ref: '#/components/schemas/paginatedOperator'
            required:
              type: boolean
              nullable: true
              description: Indicates whether this filter must be supplied by the caller.
              example: true
          required:
            - filterName
            - validationType
            - operator
    call:
      title: Call
      type: object
      properties:
        accountId:
          type: string
          description: CRM ID of the account to get calls from.
          example: '1234567'
        callId:
          type: string
          description: Unique call identifier.
          example: 1234567890abcdefghijklmnopqrstuvwxyz
        sipCallId:
          type: string
          description: The SIP call identifier associated with this call.
          example: aabbccddeeff00112233445566778899@10.0.0.1
        programmableCallId:
          type: string
          nullable: true
          description: The Programmable Voice call identifier associated with this call.
          example: c-1234567890abcdef
        startTime:
          type: string
          description: Timestamp of when the call started, conforming to RFC 3339 format.
          example: '2022-05-26T17:05:48.960Z'
        endTime:
          type: string
          description: Timestamp of when the call ended, conforming to RFC 3339 format.
          example: '2022-05-26T17:27:44.400Z'
        duration:
          type: integer
          nullable: true
          description: Length of the call, measured in milliseconds.
          example: 500000
        callingNumber:
          type: string
          nullable: true
          description: |-
            Phone number of the caller who initiated the call.

            Format: E.164 with '+' prefix
          example: '+18185559876'
        calledNumber:
          type: string
          nullable: true
          description: |-
            Phone number of the called party who received the call.

            Format: E.164 with '+' prefix
          example: '+18185551234'
        callDirection:
          $ref: '#/components/schemas/callDirection'
        callType:
          $ref: '#/components/schemas/callType'
        callResult:
          $ref: '#/components/schemas/callResult'
        sipResponseCode:
          type: integer
          description: >-
            Message generated by a user agent server (UAS) or SIP server to
            reply to a request generated by a client. A value of negative one
            (-1) indicates an unknown SIP response.
          example: 200
        sipResponseDescription:
          type: string
          description: A short description of the SIP response.
          example: OK
        cost:
          format: double
          type: number
          nullable: true
          description: >-
            Estimated cost associated with the call. This may not match directly
            to your invoice as this is an estimate. If this value is null it is
            because the cost has not yet been calculated. Cost is usually
            available within a day of call completion.
          example: 0.000123
        subAccount:
          type: string
          nullable: true
          description: Sub-Account ID.
          example: '1234'
        subAccountName:
          type: string
          nullable: true
          description: Sub-Account Name.
          example: Account 1234
        locationId:
          type: string
          nullable: true
          description: Location ID.
          example: '1234'
        locationName:
          type: string
          nullable: true
          description: Location Name.
          example: Location 1234
        sourceCountryCodeA3:
          type: string
          nullable: true
          description: Source Country in A3 format.
          example: USA
        destinationCountryCodeA3:
          type: string
          nullable: true
          description: Destination Country in A3 format.
          example: USA
        sourceIp:
          type: string
          nullable: true
          description: Source ip in ipv4 or ipv6 format.
          example: 168.212.226.204
        destinationIp:
          type: string
          nullable: true
          description: Destination ip in ipv4 or ipv6 format.
          example: 168.212.226.204
        customerJitter:
          type: integer
          nullable: true
          description: >-
            Jitter experienced by the customer during the call, measured in
            milliseconds.
          example: 500
        customerLatency:
          type: integer
          nullable: true
          description: >-
            Latency experienced by the customer during the call, measured in
            milliseconds.
          example: 500
        customerPacketLossPercentage:
          type: number
          nullable: true
          description: Packet loss percentage experienced by the customer during the call.
          example: 50.05
        carrierJitter:
          type: integer
          nullable: true
          description: >-
            Jitter experienced by the carrier during the call, measured in
            milliseconds.
          example: 500
        carrierLatency:
          type: integer
          nullable: true
          description: >-
            Latency experienced by the carrier during the call, measured in
            milliseconds.
          example: 500
        carrierPacketLossPercentage:
          type: number
          nullable: true
          description: Packet loss percentage experienced by the carrier during the call.
          example: 50.05
        attestationIndicator:
          type: string
          description: STIR/SHAKEN attestation.
          nullable: true
          enum:
            - A
            - B
            - C
          example: A
        x5u:
          type: string
          nullable: true
          description: X5U URL of the certificate’s location.
          example: https://example.com/x5u
        hangUpSource:
          $ref: '#/components/schemas/hangUpSource'
        postDialDelay:
          type: integer
          description: >-
            How long it takes for a calling party to hear a ringback tone after
            initiating a call, measured in milliseconds.
          nullable: true
          example: 0
        packetsSent:
          type: integer
          description: Count of packets sent during transmission.
          nullable: true
          example: 0
        packetsReceived:
          type: integer
          description: Count of packets received during transmission.
          nullable: true
          example: 0
        customerSbcCustomerSendMos:
          type: number
          format: double
          nullable: true
          description: >-
            MOS for audio sent from the Session Border Controller network
            (customer SBC) to the Tx/ Outbound Stream (customer).
          example: 4.2
        customerSbcCustomerReceiveMos:
          type: number
          format: double
          nullable: true
          description: >-
            MOS for audio received at the Session Border Controller network
            (customer SBC) from the Tx/ Outbound Stream (customer).
          example: 4.2
        customerSbcCarrierSendMos:
          type: number
          format: double
          nullable: true
          description: >-
            MOS for audio sent from the Session Border Controller network
            (customer SBC) to the Carrier.
          example: 4.2
        customerSbcCarrierReceiveMos:
          type: number
          format: double
          nullable: true
          description: >-
            MOS for audio received at the Session Border Controller network
            (customer SBC) from the Carrier.
          example: 4.2
    genericError:
      title: Generic Error
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
          nullable: true
          example: null
        data:
          type: object
          nullable: true
          example: null
        errors:
          type: array
          items:
            $ref: '#/components/schemas/apiError'
          nullable: true
      required:
        - links
        - data
        - errors
    callDirection:
      type: string
      description: Direction of call.
      enum:
        - INBOUND
        - INBOUND-FORWARDED
        - OUTBOUND
        - OUTBOUND-FORWARDED
      example: INBOUND
    callType:
      type: string
      description: Type of call.
      enum:
        - EMERGENCY
        - INBOUND-TFOOS
        - INFORMATION
        - INTERNATIONAL
        - INTERNATIONAL-INTERNAL
        - INTERSTATE
        - INTRASTATE
        - INTL-BLOCK
        - LOCAL
        - OPERATOR
        - OTHER-N11
        - SIPURI-EXT
        - TOLLFREE-IN
        - TOLLFREE-OUT
        - UNDETERMINED
      example: LOCAL
    callResult:
      type: string
      description: Call completion status.
      enum:
        - COMPLETE
        - INCOMPLETE
      example: COMPLETE
    attestationIndicator:
      type: array
      items:
        type: string
        enum:
          - A
          - B
          - C
      description: |-
        STIR/SHAKEN attestation.
        Filter Type: Exact Match, Multi Match.

        Example:
          * Exact Match: A
          * Multi Match: A,B
      nullable: true
      example: A
    x5u:
      type: string
      description: |-
        X5U URL of the certificate’s location.
        Filter Type: Exact Match, Text Match

        Example:
          * Exact Match: "https://example.com/x5u"
          * Text Match: "example"
      nullable: true
      example: example
    hangUpSource:
      type: string
      description: Hang up source.
      enum:
        - BANDWIDTH_INTERNAL
        - CALLED_PARTY
        - CALLING_PARTY
      example: CALLED_PARTY
    countryCodeA3:
      type: string
      description: |-
        Filter Type: Exact Match, Multimatch.

        Example:

        * Exact Match: USA
        * Multimatch: USA,IRL

        Format: two-letter (A3) country code .
    ipAddress:
      type: string
      description: |-
        Filter Type: Exact Match.

        Example:

        * Exact Match: 168.212.226.204
        * Exact Match: 2001%3Adb8%3A3333%3A4444%3A5555%3A6666%3A7777%3A8888

        Format: ipv4, ipv6 format ( : is url encoded as %3A)
      example: 168.212.226.204
    qualityStatus:
      type: string
      description: >-
        A combination of Jitter, Latency, and Packet Loss Percentage to
        determine the overall quality of the call. Quality Status filter is only
        available for accounts with Advanced Quality Metrics feature.
      enum:
        - GOOD
        - AVERAGE
        - BAD
      example: GOOD
    region:
      type: string
      enum:
        - US
        - EU
        - ALL
      example: US
      default: US
    reportRegion:
      type: string
      enum:
        - US
        - EU
      example: US
      description: >-
        The region where the report will run. Defaults to the only available
