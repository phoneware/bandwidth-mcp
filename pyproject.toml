[project]
name = "bw-mcp-server"
version = "0.3.0"
description = "Bandwidth MCP Server"
authors = [
    {name = "Bandwidth", email = "dx@bandwidth.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx~=0.28.0",
    "httpx2~=2.9",
    # Pinned exactly: 4.0.0b1 is the first release speaking MCP 2026-07-28
    # (stateless core, server/discover, subscriptions/listen) and it is still
    # a beta. Move the pin deliberately, and keep Dockerfile + cloudbuild.yaml
    # in lockstep — they install these pins by hand, not from this file.
    "fastmcp==4.0.0b1",
    "mcp>=2.0.0,<3",
    "pyyaml~=6.0.0",
    "werkzeug>=3.1.4"
]

[project.scripts]
start = "app:main"

[tool.setuptools]
py-modules = [
    "app", "config", "servers", "server_utils", "resources",
    "instructions", "profiles", "oauth", "event_store", "callbacks", "tunnel",
]
packages = ["specs", "tools"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
specs = ["*.yml", "*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-httpx>=0.35.0",
]
