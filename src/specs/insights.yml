                  reportDefinitions:
                    type: array
                    items:
                      $ref: '#/components/schemas/reportDefinitionObject'
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/apiError'
                example: []
            required:
              - links
              - data
              - errors
    paginatedResultResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              links:
                type: array
                nullable: true
                description: >-
                  HATEOAS navigation links for this resource. Null on error
