  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Bearer authentication uses short-lived JWT tokens generated by our
        authentication server. Obtain a token using your API client credentials
        and include it in the `Authorization` header.


        - Example: `Authorization: Bearer <token>`


        Where `<token>` should be replaced with the token string without angle
        brackets.


        For more information, see the following guide:
        [Credentials](https://dev.bandwidth.com/docs/account/credentials/management)
    Basic:
      type: http
      scheme: basic
      x-deprecated: true
      description: >-
        **Deprecated — migrate to Bearer authentication as soon as possible.**
        API Users will be fully decommissioned on **December 2, 2026**, after
        which Basic auth will stop functioning. See the Bearer scheme above for
        the recommended approach.


        Basic authentication sends a Base64-encoded `username:password` pair in
        the `Authorization` header.


        - Example: `Authorization: Basic ZGVtbZpwQDU1dzByZA==`
