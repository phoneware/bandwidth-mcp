        Unavailable` response in these cases, with an error message indicating
        that the data is still loading. If you receive a `503`, retry your
        request immediately with the exact same parameters.
      operationId: getCallsPerSecondData
      tags:
        - Voice
      parameters:
        - $ref: '#/components/parameters/monitorAccountId'
        - $ref: '#/components/parameters/monitorTimestamp'
        - $ref: '#/components/parameters/monitorFromPhoneNumber'
        - $ref: '#/components/parameters/monitorToPhoneNumber'
        - $ref: '#/components/parameters/monitorSubAccount'
        - $ref: '#/components/parameters/monitorCallType'
        - $ref: '#/components/parameters/monitorHangUpSource'
        - $ref: '#/components/parameters/monitorSourceCountryCodeA3'
        - $ref: '#/components/parameters/monitorDestinationCountryCodeA3'
      responses:
        '200':
          $ref: '#/components/responses/getMonitorCallsPerSecondResponseOk'
        '400':
          $ref: '#/components/responses/monitorBadRequestError'
        '401':
          $ref: '#/components/responses/monitorUnauthorizedError'
        '403':
          $ref: '#/components/responses/monitorForbiddenError'
        '404':
          $ref: '#/components/responses/monitorNotFoundError'
        '405':
          $ref: '#/components/responses/monitorMethodNotFoundError'
        '429':
